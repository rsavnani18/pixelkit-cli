
name: Publish PixelKit CLI

'on':
  push:
    tags:
      - 'v*'

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and Publish to npm

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Update npm CLI
        run: npm install --global npm@latest

      - name: Verify npm version
        run: npm --version

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          EXPECTED_TAG="v${PACKAGE_VERSION}"

          if [ "$RELEASE_TAG" != "$EXPECTED_TAG" ]; then
            echo "Error: Git tag does not match package.json version."
            echo "Expected: $EXPECTED_TAG"
            echo "Received: $RELEASE_TAG"
            exit 1
          fi

          echo "Release version verified: $PACKAGE_VERSION"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run prepublish checks and build
        run: pnpm run prepublishOnly

      - name: Publish package to npm
        run: npm publish --access public --provenance --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish completed
        run: echo "PixelKit CLI published successfully!"
